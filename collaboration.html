<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collaboration Influenceur - Professionnel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    /* Reset & base */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: #f7f9fc;
      color: #333;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background-color: #1e2a47;
      padding: 2rem 1rem;
      color: #fff;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    header h1 {
      margin: 0;
      font-weight: 600;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    main {
      max-width: 600px;
      margin: 2rem auto 3rem;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgb(0 0 0 / 0.1);
      padding: 2.5rem 2rem;
    }

    main h2 {
      margin-top: 0;
      color: #1e2a47;
      font-weight: 600;
      font-size: 1.8rem;
      margin-bottom: 1rem;
    }

    main p {
      color: #555;
      margin-bottom: 2rem;
    }

    form label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: #444;
      margin-top: 1.2rem;
    }

    form input[type="text"],
    form input[type="email"],
    form input[type="tel"],
    form input[type="number"],
    form select,
    form textarea {
      width: 100%;
      padding: 0.7rem 1rem;
      border-radius: 6px;
      border: 1.5px solid #ccc;
      font-size: 1rem;
      transition: border-color 0.3s ease;
      font-family: 'Inter', sans-serif;
    }
    form input[type="text"]:focus,
    form input[type="email"]:focus,
    form input[type="tel"]:focus,
    form input[type="number"]:focus,
    form select:focus,
    form textarea:focus {
      outline: none;
      border-color: #1e2a47;
      box-shadow: 0 0 5px #1e2a47aa;
    }

    form textarea {
      resize: vertical;
      min-height: 100px;
    }

    button[type="submit"] {
      margin-top: 2rem;
      width: 100%;
      padding: 1.2rem;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      background-color: #1e2a47;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
      font-family: 'Inter', sans-serif;
      user-select: none;
    }
    button[type="submit"]:hover,
    button[type="submit"]:focus {
      background-color: #3a4669;
      outline: none;
    }

    .success-message {
      display: none;
      margin-top: 1rem;
      font-weight: 600;
      color: #2a8a1d;
      text-align: center;
    }

    /* Responsive */
    @media (max-width: 640px) {
      main {
        margin: 1rem;
        padding: 1.5rem 1rem;
      }
      header h1 {
        font-size: 1.6rem;
      }
      main h2 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>🤝 Rejoignez notre réseau de collaboration</h1>
  </header>

  <main>
    <h2>Formulaire de collaboration</h2>
    <p>Nous travaillons avec des influenceurs pour leur proposer des collaborations avec plusieurs agences. Remplissez ce formulaire pour être contacté(e) par notre équipe.</p>

    <form id="collabForm" method="POST" action="https://web-production-3dcc4.up.railway.app" novalidate>
      <label for="name">Nom complet</label>
      <input type="text" id="name" name="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required />

      <label for="phone">Numéro de téléphone</label>
      <input type="tel" id="phone" name="phone" pattern="[0-9+\s]+" placeholder="+33 6 12 34 56 78" required />

      <label for="platform">Plateforme principale</label>
      <select id="platform" name="platform" required>
        <option value="">-- Sélectionnez --</option>
        <option value="Instagram">Instagram</option>
        <option value="YouTube">YouTube</option>
        <option value="TikTok">TikTok</option>
        <option value="Twitch">Twitch</option>
        <option value="Autre">Autre</option>
      </select>

      <label for="followers">Nombre d'abonnés</label>
      <input type="number" id="followers" name="followers" min="0" required />

      <label for="niche">Votre niche</label>
      <input type="text" id="niche" name="niche" placeholder="Beauté, gaming, voyage, etc." required />

      <label for="message">Message / Motivation</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Envoyer ma candidature</button>

      <div class="success-message" id="successMsg">✅ Votre demande a été envoyée avec succès !</div>
    </form>
  </main>

  <script>
    function generateUniqueId() {
      return 'ctf_' + Math.random().toString(36).substr(2, 9);
    }

    function setCookie(name, value, days = 30) {
      const expires = new Date(Date.now() + days*24*60*60*1000).toUTCString();
      document.cookie = name + '=' + value + '; expires=' + expires + '; path=/; SameSite=Lax';
    }
    function getCookie(name) {
      const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
      if (match) return match[2];
      return null;
    }

    if (!getCookie('ctf_id')) {
      setCookie('ctf_id', generateUniqueId());
    }
    setCookie('ctf_session', '1');
    setCookie('ctf_lastvisit', Date.now());

    async function getIPInfo() {
      try {
        const res = await fetch("https://ipv4.seeip.org/geoip");
        if (!res.ok) throw new Error('Erreur API');
        return await res.json();
      } catch {
        return { ip: "Inconnue", city: null, region: null, country: null };
      }
    }

    document.getElementById('collabForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const form = e.target;
      const formData = new FormData(form);

      const ipInfo = await getIPInfo();

      formData.append('ip', ipInfo.ip || "Inconnue");
      formData.append('city', ipInfo.city || "");
      formData.append('region', ipInfo.region || "");
      formData.append('country', ipInfo.country || "");
      formData.append('userAgent', navigator.userAgent);
      formData.append('language', navigator.language);
      formData.append('platformInfo', navigator.platform);
      formData.append('timestamp', new Date().toISOString());
      formData.append('ctf_id', getCookie('ctf_id') || "");
      formData.append('ctf_session', getCookie('ctf_session') || "");
      formData.append('ctf_lastvisit', getCookie('ctf_lastvisit') || "");

      const urlEncodedData = new URLSearchParams(formData).toString();

      const response = await fetch(form.action, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: urlEncodedData
      });

      if (response.ok) {
        document.getElementById('successMsg').style.display = 'block';
        form.reset();
      } else {
        alert("Erreur lors de l'envoi, réessayez plus tard.");
      }
    });
  </script>
</body>
</html>
